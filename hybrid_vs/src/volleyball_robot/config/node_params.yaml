# ===== 全局共享参数 =====
/**:
  ros__parameters:
    k: 0.02           #空气阻力系数
    m: 0.27           #排球质量，单位kg
    g: 9.80           #重力加速度，单位m/s^2

pid_camera_node:
  ros__parameters:
    model_path: "model/volleyball_v3_1_int8/best.xml"
    confidence_threshold: 0.6
    NMS_threshold: 0.45
    usb_cam_topic: "/usb_cam/image_raw"
    debug: true
    debug_frame_skip: 3

# IBVS 反应式控制器
ibvs_controller_node:
  ros__parameters:
    Kp_lat: 6057.0        # 横向比例增益 (cm/s)/m（strike_point系 y, 1m→6057cm/s）
    Kp_long: 500.0         # 纵向比例增益 (cm/s)/m，3m→1500cm/s，1m→500cm/s
    Kd_lat: 160.0           # 横向微分增益 cm/s² per m/s（y变化率→速度修正）
    alpha: 0.75           # EMA 平滑系数 (0~1)
    timeout: 0.5         # 看门狗超时 (s)
    hit_offset_x: 0.60      # 击球点 X 轴范围（前方），单位 m
    hit_offset_y: 0.35      # 击球点 Y 轴范围（横向），单位 m
    hit_offset_z: 0.3      # 击球点 Z 轴范围（高度），单位 m
    dist_offset: 0.35       
    target_frame: "strike_point"

#检测节点
detector_node:
  ros__parameters:
    model_path: "model/volleyball_v3_3_int8/best.xml"
    model_confidence_threshold : 0.6
    model_NMS_threshold : 0.45
    depth_validation_threshold : 0.5
    debug : true
    camera_frame_id : "camera_color_optical_frame"
    debug_frame_skip: 3

#追踪节点
tracker_node:
  ros__parameters:
    #过程噪声矩阵（自适应Q，低速大→跟测量，高速小→信任物理模型）
    Q_sigma_xy_min: 3.0
    Q_sigma_xy_max: 200.0
    Q_sigma_z_min: 5.0
    Q_sigma_z_max: 200.0
    #测量噪声矩阵
    sigma_pixel : 5
    sigma_depth_gain : 0.007
    sigma_depth_const : 0.02
    #tracker各种时间阈值
    detect_cnt_thres: 3
    lost_time_thres: 0.5
    selfcheck_time_thres: 0.05
    #tf2
    target_frame_id: "odom"

#预测节点
predict_node:
  ros__parameters:
    predict_timer_freq: 500  #Hz
    predict_step: 0.02 #预测器步长，单位s
    odom_frame_id: "odom"
    lost_time_thres: 3.0 #丢检后预测时间阈值，超出后不再预测

#规划节点
planner_node:
  ros__parameters:
    base_to_armjoint: 0.18
    armjoint_to_strikingpoint: 0.02
    delta_arm_angle : 33.0 #delta机械臂工作方向与竖直方向夹角
    # 落点统计参数
    landing_buffer_size: 50       # 缓冲区最大样本数
    landing_time_window: 0.4      # 样本有效时间窗口（秒）
    coarse_std_threshold: 0.2     # 切换到 FINE 的标准差阈值（米）
    min_samples_for_output: 3     # 最少样本数才开始输出
    data_timeout: 1.5             # 无新数据超时清空缓冲区（秒）
    # 静止检测参数（球被人抱在手上时，轨迹初末位置XY距离很小且持续一段时间，跳过规划）
    stationary_xy_threshold: 0.3   # 轨迹初末位置 XY 距离阈值（米），小于此值认为球未移动
    stationary_time_threshold: 0.5 # 连续静止持续时间阈值（秒），超过此值确认球静止

#串口节点
serial_driver_node:
  ros__parameters:
    timestamp_offset: 0.005
    device_name: "/dev/ttyACM0"
    baud_rate: 115200
    odom_frame_id: "odom"
    base_link_frame_id: "base_link"
    # 下位机→上位机坐标系转换参数,单位deg度
    # 下位机: x右 y前, 上位机: x前 y右
    odom2base_rpy: [0.0, 0.0, 90.0]
